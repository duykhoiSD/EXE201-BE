services:
  - type: web
    name: insurmatch-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: insurmatch-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: insurmatch-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: insurmatch-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: insurmatch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: insurmatch-db
          property: password
      - key: DB_SSL
        value: "?sslmode=require"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://thebestrateins-exe201.vercel.app"
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_SENDER_EMAIL
        sync: false

databases:
  - name: insurmatch-db
    plan: free
    region: singapore
    databaseName: insurmatch_db
    user: insurmatch_user
