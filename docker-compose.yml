version: '3.8'

services:
  # ---------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: insurmatch_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurmatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insurmatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # pgAdmin (Web GUI for Database Management)
  # Access at http://localhost:5050
  # ---------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: insurmatch_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@insurmatch.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
